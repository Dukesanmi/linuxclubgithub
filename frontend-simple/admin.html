<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Club - Admin Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .admin-login {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        
        .logo {
            font-size: 2rem;
            color: #00ff88;
            margin-bottom: 1rem;
        }
        
        h1 {
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #00ff88, #ffffff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .btn {
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin: 0.5rem;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        
        .stat {
            background: rgba(0, 255, 136, 0.1);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        
        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }
        
        .user-list {
            text-align: left;
            margin-top: 2rem;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .role-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .role-admin { background: #ff6b6b; }
        .role-teacher { background: #4ecdc4; }
        .role-user { background: rgba(255, 255, 255, 0.2); }
        
        .error { color: #ff6b6b; }
        .success { color: #00ff88; }
    </style>
</head>
<body>
    <div class="admin-login" id="admin-portal">
        <div class="logo">👑</div>
        <h1>Admin Portal</h1>
        <div id="admin-content">
            <p>Loading admin dashboard...</p>
        </div>
    </div>

    <script>
        const BACKEND_URL = window.location.protocol + '//' + window.location.hostname + ':5000';

        // Check authentication and role
        window.addEventListener('load', async function() {
            const token = localStorage.getItem('token');
            const userData = localStorage.getItem('user');
            
            if (!token || !userData) {
                showLogin();
                return;
            }

            try {
                const user = JSON.parse(userData);
                if (user.role === 'admin') {
                    await loadAdminDashboard(user);
                } else if (user.role === 'teacher') {
                    showTeacherDashboard(user);
                } else {
                    showAccessDenied();
                }
            } catch (error) {
                console.error('Error loading admin portal:', error);
                showLogin();
            }
        });

        function showLogin() {
            document.getElementById('admin-content').innerHTML = `
                <p class="error">Access Denied</p>
                <p>You must be logged in as an admin or teacher to access this portal.</p>
                <a href="/" class="btn">Return to Main Site</a>
            `;
        }

        function showAccessDenied() {
            document.getElementById('admin-content').innerHTML = `
                <p class="error">Insufficient Permissions</p>
                <p>This portal is only available to admins and teachers.</p>
                <a href="/" class="btn">Return to Dashboard</a>
            `;
        }

        function showTeacherDashboard(user) {
            document.getElementById('admin-content').innerHTML = `
                <h2>Welcome, ${user.name}!</h2>
                <p>Teacher Dashboard</p>
                <div class="admin-stats">
                    <div class="stat">
                        <div class="stat-number">0</div>
                        <div>Courses Created</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">0</div>
                        <div>Students</div>
                    </div>
                </div>
                <p><em>Full teacher portal features coming soon!</em></p>
                <a href="/" class="btn">Return to Main Site</a>
            `;
        }

        async function loadAdminDashboard(user) {
            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/dashboard`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load dashboard');
                }

                const data = await response.json();
                
                document.getElementById('admin-content').innerHTML = `
                    <h2>Welcome, ${user.name}!</h2>
                    <p>Platform Administrator</p>
                    
                    <div class="admin-stats">
                        <div class="stat">
                            <div class="stat-number">${data.stats.totalUsers}</div>
                            <div>Total Users</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number">${data.stats.activeUsers}</div>
                            <div>Active Users</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number">${data.stats.totalCourses}</div>
                            <div>Courses</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number">${data.stats.teacherCount}</div>
                            <div>Teachers</div>
                        </div>
                    </div>

                    <div class="user-list">
                        <h3>Recent Users</h3>
                        ${data.recentUsers.map(user => `
                            <div class="user-item">
                                <div>
                                    <div>${user.name}</div>
                                    <div style="font-size: 0.8rem; color: #ccc;">${user.email}</div>
                                </div>
                                <span class="role-badge role-${user.role}">${user.role}</span>
                            </div>
                        `).join('')}
                    </div>

                    <div style="margin-top: 2rem;">
                        <button class="btn" onclick="loadUsers()">Manage Users</button>
                        <button class="btn" onclick="manageSettings()">Platform Settings</button>
                        <a href="/" class="btn">Return to Main Site</a>
                    </div>
                `;

            } catch (error) {
                console.error('Failed to load admin dashboard:', error);
                document.getElementById('admin-content').innerHTML = `
                    <p class="error">Failed to load dashboard</p>
                    <p>Error: ${error.message}</p>
                    <a href="/" class="btn">Return to Main Site</a>
                `;
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/users`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load users');
                }

                const data = await response.json();
                
                document.getElementById('admin-content').innerHTML = `
                    <h2>User Management</h2>
                    <p>Total Users: ${data.users.length}</p>
                    
                    <div class="user-list">
                        ${data.users.map(user => `
                            <div class="user-item">
                                <div>
                                    <div><strong>${user.name}</strong></div>
                                    <div style="font-size: 0.8rem; color: #ccc;">${user.email}</div>
                                    <div style="font-size: 0.8rem; color: ${user.isActive ? '#00ff88' : '#ff6b6b'};">
                                        ${user.isActive ? 'Active' : 'Inactive'} • Joined: ${new Date(user.signupDate).toLocaleDateString()}
                                    </div>
                                </div>
                                <span class="role-badge role-${user.role}">${user.role}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <button class="btn" onclick="loadAdminDashboard(${JSON.stringify(JSON.parse(localStorage.getItem('user')))})">Back to Dashboard</button>
                `;

            } catch (error) {
                console.error('Failed to load users:', error);
                alert('Failed to load users: ' + error.message);
            }
        }

        function manageSettings() {
            document.getElementById('admin-content').innerHTML = `
                <h2>Platform Settings</h2>
                <p>Platform configuration features will be available here.</p>
                <ul style="text-align: left; margin: 1rem 0;">
                    <li>Site name and description</li>
                    <li>Registration settings</li>
                    <li>Email configuration</li>
                    <li>Feature toggles</li>
                    <li>Security settings</li>
                </ul>
                <button class="btn" onclick="loadAdminDashboard(${JSON.stringify(JSON.parse(localStorage.getItem('user')))})">Back to Dashboard</button>
            `;
        }
    </script>
</body>
</html>
