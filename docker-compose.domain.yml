version: '3.8'

services:
  mongodb:
    image: mongo:4.4
    container_name: linuxclub_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: demo123
    ports:
      - "127.0.0.1:27017:27017"  # Only bind to localhost for security
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  backend:
    build: 
      context: ./backend
    container_name: linuxclub_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: https://linuxclub.tech
      MONGODB_URI: mongodb://admin:demo123@mongodb:27017/linuxclub?authSource=admin
      JWT_SECRET: K2wW?S'\Kfh`A#hP%\`EWOH.$5Yfl73t
    ports:
      - "127.0.0.1:5000:5000"  # Only bind to localhost, nginx will proxy
    depends_on:
      - mongodb

  frontend:
    image: nginx:alpine
    container_name: linuxclub_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend-domain:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/ssl/certs:ro
    depends_on:
      - backend

volumes:
  mongodb_data:
