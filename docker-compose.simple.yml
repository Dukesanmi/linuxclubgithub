version: '3.8'

services:
  mongodb:
    image: mongo:4.4
    container_name: linuxclub_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: demo123
      MONGO_INITDB_DATABASE: linuxclub
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build: 
      context: ./backend
    container_name: linuxclub_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      CORS_ORIGIN: http://vltdocker01.zth.com:3000
      MONGODB_URI: mongodb://admin:demo123@mongodb:27017/linuxclub?authSource=admin
      JWT_SECRET: K2wW?S'\Kfh`A#hP%\`EWOH.$5Yfl73t
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: linuxclub_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend-simple:/usr/share/nginx/html:ro
      - ./frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
volumes:
  mongodb_data: